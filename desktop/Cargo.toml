[package]
name = "desktop"
version = "0.2.0"
edition = "2024"
build = "build.rs"

# The package is named generically (`desktop`); the shipped binary is the app
# itself, `chronos` on every platform.
[[bin]]
name = "chronos"
path = "src/main.rs"

[dependencies]
chronos = { path = ".." }
crux_core = { workspace = true }
serde_json.workspace = true
serde.workspace = true
dirs = "5.0"
gtk4 = {version = "0.11.5", features = ["v4_12"]}
open = "5.4.3"
resvg = "0.43"
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[package]
name = "desktop"
version = { workspace = true }
# Single source of truth for the author contact: the deb control's Maintainer
# (cargo-packager auto-fills it from this field in the metadata flow) and the
# About page (rendered via `env!("CARGO_PKG_AUTHORS")`).
authors = ["Dawid Pawelec <uliat@protonmail.com>"]
edition = "2024"
build = "build.rs"

# The package is named generically (`desktop`); the shipped binary is the app
# itself, `chronos` on every platform.
[[bin]]
name = "chronos"
path = "src/main.rs"

[dependencies]
chronos = { path = ".." }
crux_core = { workspace = true }
serde_json.workspace = true
serde.workspace = true
dirs = "5.0"
gtk4 = {version = "0.11.5", features = ["v4_12"]}
open = "5.4.3"
resvg = "0.43"
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# Linux packager for deb.
[package.metadata.packager]
product_name = "Chronos"
identifier = "com.chronos.app"
publisher = "Dawid Pawelec"
copyright = "Copyright (c) Dawid Pawelec (GPL-3.0); pattern artwork (c) kationart (CC BY-SA 4.0)"
homepage = "https://github.com/Dawid9596/chronos"
description = "Conservation Editor"
long_description = "Stratigraphic layer and condition documentation tool for conservation projects."
icons = ["../icons/bitmap.png"]
out_dir = "../target/release/packager"

binaries = [
  { path = "chronos", main = true },
]

[package.metadata.packager.deb]
# Dependency names for Ubuntu 24.04 (noble) where libgtk-4 got the time64 ABI
# suffix. Adjust if you ever target Debian 12 (libgtk-4-1) there.
depends = [
  "libgtk-4-1t64",
  "librsvg2-common",
]

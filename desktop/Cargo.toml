[package]
name = "desktop"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
edition = "2024"
build = "build.rs"

# The package is named generically (`desktop`); the shipped binary is the app
# itself, `chronos` on every platform.
[[bin]]
name = "chronos"
path = "src/main.rs"

[dependencies]
chronos = { path = ".." }
crux_core = { workspace = true }
serde_json.workspace = true
serde.workspace = true
dirs = "5.0"
gtk4 = {version = "0.11.5", features = ["v4_12"]}
open = "5.4.3"
resvg = "0.43"
libc = "0.2"
ureq = "2.12"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# Linux packager (deb + AppImage).
[package.metadata.packager]
product_name = "Chronos"
identifier = "com.chronos.app"
copyright = "Copyright (c) Dawid Pawelec (GPL-3.0); pattern artwork (c) kationart (CC BY-SA 4.0)"
homepage = "https://github.com/Dawid9596/chronos"
long_description = "Stratigraphic layer and condition documentation tool for conservation projects."
icons = ["../icons/bitmap.png", "../icons/chronos-256.png"]
out_dir = "../target/release/packager"

[package.metadata.packager.appimage]
# linuxdeploy's bundled (old) strip chokes on .relr.dyn sections present in
# modern system libs. Skipped instead in the release workflow via the
# `NO_STRIP=true` env var (see release.yml), which linuxdeploy honors; every
# lib then ships unstripped, keeping the exclusion list empty.
#
# The GTK plugin is vendored in packaging/linuxdeploy-plugin-gtk.sh and put on
# PATH during packaging (see release.yml); no [linuxdeploy-plugins] table is
# used, so cargo-packager never downloads an unpinned copy from GitHub.

[package.metadata.packager.deb]
# Dependency names for Ubuntu 24.04 (noble) where libgtk-4 got the time64 ABI
# suffix. Adjust if you ever target Debian 12 (libgtk-4-1) there.
depends = [
  "libgtk-4-1",
  "librsvg2-common",
  "adwaita-icon-theme",
]

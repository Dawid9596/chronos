[workspace]
resolver = "2"
members = [
    "desktop"
]

[workspace.package]
version = "0.5.0"
authors = ["Dawid Pawelec <uliat@protonmail.com>"]
description = "Conservation Editor"


[package]
name = "chronos"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
edition = "2024"
repository = "https://github.com/Dawid9596/chronos"
license = "GPL-3.0-only"

[dependencies]
chrono.workspace = true
comemo.workspace = true
crux_core.workspace = true
crux_macros.workspace = true
lopdf = "0.37"
serde.workspace = true
serde_json.workspace = true
typst.workspace = true
typst-pdf.workspace = true

[workspace.dependencies]
crux_core = "0.14" 
crux_macros = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
typst = "0.12"
typst-pdf = "0.12"
chrono = "0.4"
comemo = "0.4"
serde_json = "1.0.151"

# Windows packager. The MSI consumes: product_name, version (auto from the
# manifest), identifier, publisher, icons, binaries, resources. Other config
# fields (copyright, homepage, description, authors) are not used for an MSI;
# the deb-specific metadata lives in desktop/Cargo.toml.
[package.metadata.packager]
product_name = "Chronos"
identifier = "com.chronos.app"
publisher = "Dawid Pawelec"
formats = ["wix"]
icons = ["icons/icon.ico"]

binaries = [
  { path = "chronos.exe", main = true }
]

resources = [
  "dll_stage/*.dll",
  { src = "dll_stage/schemas", target = "share/glib-2.0/schemas" },
  { src = "dll_stage/gdk-pixbuf-2.0", target = "lib/gdk-pixbuf-2.0" },
  { src = "dll_stage/hicolor", target = "share/icons/hicolor" },
  { src = "dll_stage/Adwaita", target = "share/icons/Adwaita" },
]
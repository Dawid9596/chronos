[workspace]
resolver = "2"
members = [
    "linux-shell"
]


[package]
name = "chronos"
version = "0.1.0"
edition = "2024"
# TODO: remove once the real repo exists (published with the next public release)
repository = "https://github.com/Dawid9596/chronos"
license = "GPL-3.0-only"

[dependencies]
chrono.workspace = true
comemo.workspace = true
crux_core.workspace = true
crux_macros.workspace = true
lopdf = "0.37"
serde.workspace = true
serde_json.workspace = true
typst.workspace = true
typst-pdf.workspace = true

[workspace.dependencies]
crux_core = "0.14" 
crux_macros = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
typst = "0.12"
typst-pdf = "0.12"
chrono = "0.4"
comemo = "0.4"
serde_json = "1.0.151"

# Windows packager
[package.metadata.packager]
product_name = "Chronos"
version = "0.1.0"
identifier = "com.chronos.app"
# TODO: remove once the real repo exists (published with the next public release)
homepage = "https://github.com/Dawid9596/chronos"
formats = ["wix"]
icons = ["icons/icon.ico"]

binaries = [
  { path = "linux-shell.exe", main = true }
]

resources = [
  "dll_stage/*.dll",
  { src = "dll_stage/schemas", target = "share/glib-2.0/schemas" },
  { src = "dll_stage/gdk-pixbuf-2.0", target = "lib/gdk-pixbuf-2.0" },
  { src = "dll_stage/hicolor", target = "share/icons/hicolor" },
  { src = "dll_stage/Adwaita", target = "share/icons/Adwaita" },
]
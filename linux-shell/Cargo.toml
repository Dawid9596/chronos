[package]
name = "linux-shell"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
chronos = { path = ".." }
crux_core = { workspace = true }
serde_json.workspace = true
serde.workspace = true
dirs = "5.0"
gtk4 = {version = "0.11.5", features = ["v4_12"]}
open = "5.4.3"
resvg = "0.43"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

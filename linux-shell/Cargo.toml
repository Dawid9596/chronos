[package]
name = "linux-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
chronos = { path = ".." }
crux_core = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
gtk4 = {version = "0.11.4", features = ["v4_10"]}
open = "5.4.3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
# Publishes installer artifacts to the GitHub release of a `v*` tag.
#
# Windows intentionally reuses ./build_installer.sh: the MSI must embed a
# matched GTK4 runtime (ucrt64 DLL scan, loader cache, glib schemas, themes), so
# the whole build happens inside the MSYS2 UCRT64 environment rather than with
# a runner's default MSVC toolchain.
#
# NB: cargo-packager puts the .msi directly in ${CARGO_TARGET_DIR:-target}/release
# (not in a packager/ subfolder); the Linux .deb does land in release/packager/.

name: release

on:
  push:
    tags: ["v*"]
  # Manual triggering for rehearsing/debugging without creating tags.
  # The "Upload release assets" steps only run on tag pushes, so manual runs
  # are pure build verification (no release/debris gets created).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (msi)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # git on Windows runners converts LF->CRLF (core.autocrlf), which breaks
      # the bash installer script ("\r: command not found"). Disable it before
      # checkout.
      - name: Disable CRLF conversion for this checkout
        run: git config --global core.autocrlf input
        shell: pwsh

      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-pkgconf
            gawk

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build installer
        run: bash ./build_installer.sh

      # Stage the artifacts next to the repo. cargo-packager has moved outputs
      # around between versions (the msi lands in release/, known locally), so
      # try both candidate locations and fail loudly if nothing was produced.
      - name: Stage msi
        run: |
          mkdir -p ./dist
          cp "$CARGO_TARGET_DIR/release/"*.msi ./dist/ 2>/dev/null \
            || cp "$CARGO_TARGET_DIR/release/packager/"*.msi ./dist/
          # cargo-packager derives the file name from the (OS-neutral) binary
          # name; stamp the releases with the target OS instead.
          for f in dist/chronos_*.msi; do
            mv "$f" "${f/chronos_/chronos-windows_}"
          done
        env:
          # build_installer.sh defaults it; mirror it here for the copy step
          CARGO_TARGET_DIR: C:/build/chronos-target

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi

  linux:
    name: Linux (deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NB: ubuntu-latest (= 24.04) ships GTK 4.14; if this ever drops to an
      # image with GTK < 4.12 the build fails because the desktop crate enables
      # the gtk4 crate's "v4_12" feature.
      - name: Install GTK dev dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # cargo-packager does not build anything itself (mirrors the Windows
      # job where build_installer.sh builds first).
      - name: Build binary
        run: cargo build --release -p desktop

      # Packaging is driven by [package.metadata.packager] in
      # desktop/Cargo.toml. NB: without --config, cargo-packager needs
      # `--release` to look for the binary in target/release; it does not
      # build anything itself.
      #
      # NO_STRIP=true skips the old `strip` bundled inside linuxdeploy, which
      # cannot handle modern .relr.dyn sections in system libs and aborts the
      # AppImage build (linuxdeploy issue #272); the libs then ship unstripped.
      - name: Package deb and AppImage
        env:
          NO_STRIP: "true"
        run: cargo packager --release -p desktop --formats deb,appimage --verbose

      # Same dual-location staging as the Windows job: the deb lands in
      # target/release/packager/ (the config's out_dir), but verify loudly.
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/packager/*.deb target/release/packager/*.AppImage dist/ 2>/dev/null \
            || cp target/release/*.deb target/release/*.AppImage dist/ 2>/dev/null
          # cargo-packager derives the file name from the (OS-neutral) binary
          # name; stamp the releases with the target OS instead.
          for f in dist/chronos_*.deb dist/chronos_*.AppImage; do
            [ -e "$f" ] || continue
            mv "$f" "${f/chronos_/chronos-linux_}"
          done
          test -n "$(ls dist)"

      - name: Stage portable binary
        run: |
          cp target/release/chronos dist/chronos-linux-x64
          tar -czf dist/chronos-linux-x64.tar.gz -C dist chronos-linux-x64

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

  release-notes:
    name: Release notes (install instructions)
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Write install instructions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## Installation

          | Platform | File | How to install |
          |----------|------|----------------|
          | Windows | \`chronos-windows_${VERSION}_x64_en-US.msi\` | Run the installer |
          | Ubuntu / Debian | \`chronos-linux_${VERSION}_amd64.deb\` | \`sudo apt install ./chronos-linux_${VERSION}_amd64.deb\` |
          | Other Linux | \`chronos-linux_${VERSION}_x86_64.AppImage\` | \`chmod +x chronos-linux_${VERSION}_x86_64.AppImage && ./chronos-linux_${VERSION}_x86_64.AppImage\` |
          | Portable Linux | \`chronos-linux-x64.tar.gz\` | Unpack and run the contained binary |

          Notes:

          - The .deb targets Ubuntu 24.04 / Debian 13 or newer.
          - AppImages need FUSE (\`libfuse2\`); on systems without it, run the
            AppImage with \`--appimage-extract-and-run\` instead.
          - The portable archive contains only the binary and expects the GTK 4
            runtime to be installed through your distribution.
          EOF

      - name: Set release body
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
